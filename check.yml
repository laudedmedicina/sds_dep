name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  script:
    runs-on: ubuntu-latest
    name: parse the analysis script
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # The pipeline needs individual-level data that is not distributed with
      # the repository, so CI checks what it can without it: that the script is
      # valid R, and that no absolute path has crept back into it.
      - name: R syntax check
        run: Rscript -e 'invisible(parse("R/analysis_SDS.R")); cat("analysis_SDS.R parses cleanly\n")'

      - name: no hard-coded absolute paths
        run: |
          if grep -nE '"([A-Za-z]:[\\/]|/(home|Users|mnt)/)' R/analysis_SDS.R; then
            echo "::error::absolute path found in R/analysis_SDS.R - use paths relative to BASE"
            exit 1
          fi
          echo "no absolute paths"

      - name: data files are not committed
        run: |
          if git ls-files | grep -iE '\.xlsx?$'; then
            echo "::error::a spreadsheet is tracked by git - see data/README.md"
            exit 1
          fi
          echo "no data files tracked"
